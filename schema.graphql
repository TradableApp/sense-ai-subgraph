# --- Chat Entities ---

# Mutable: Timestamps and Metadata CIDs update over time
type Conversation @entity(immutable: false) {
  id: ID!
  owner: Bytes!
  conversationId: BigInt!
  conversationCID: String!
  conversationMetadataCID: String!
  lastMessageCreatedAt: BigInt!
  createdAtBlock: BigInt!
  isDeleted: Boolean!
  messages: [Message!]! @derivedFrom(field: "conversation")
  promptRequests: [PromptRequest!]! @derivedFrom(field: "conversation")
  branchedFrom: Conversation
}

# Immutable: Once a message is sent, it is never altered on-chain
type Message @entity(immutable: true) {
  id: ID!
  messageId: BigInt!
  conversation: Conversation!
  messageCID: String!
  role: String!
  createdAt: BigInt!
  transactionHash: String!
  searchDelta: SearchDelta
}

# Immutable: Search keywords are static for a specific message
type SearchDelta @entity(immutable: true) {
  id: ID!
  message: Message!
  searchDeltaCID: String!
}

# --- Prompt Request (For Cancelled/Pending History) ---

# This stores the raw intent before it becomes a permanent Message.
type PromptRequest @entity(immutable: false) {
  id: ID! # This will be the answerMessageId
  promptMessageId: BigInt! # Stored for frontend reference
  conversation: Conversation!
  user: Bytes!
  encryptedPayload: Bytes!
  isCancelled: Boolean!
  isAnswered: Boolean!
  isRefunded: Boolean!
  createdAt: BigInt!
  transactionHash: String!
}

# --- Financial Entities ---

# Mutable: Status changes from PENDING -> COMPLETE
type Payment @entity(immutable: false) {
  id: ID! # escrowId
  user: Bytes!
  amount: BigInt!
  status: String! # "PENDING", "COMPLETE", "REFUNDED"
  createdAt: BigInt!
  finalizedAt: BigInt
  txHash: String!
}

# Mutable: Allowance and Expiry update over time
type SpendingLimit @entity(immutable: false) {
  id: ID! # user address
  user: Bytes!
  allowance: BigInt!
  expiresAt: BigInt!
  updatedAt: BigInt!
}

# --- Protocol Configuration (Singletons) ---

# Mutable: Updated whenever the owner changes the escrow address, the treasury address or the
# key clients encrypt to. The oracles themselves are a set: see Oracle.
type ProtocolConfig @entity(immutable: false) {
  id: ID! # always "singleton"
  escrowAddress: Bytes
  treasuryAddress: Bytes
  oracleEncryptionKey: Bytes # secp256k1 public key, compressed or uncompressed; null until published
  updatedAt: BigInt!
}

# Mutable: One record per address that has ever held the oracle role. Several can be active at
# once (a rotation adds the new oracle before it removes the old one). Current set:
# oracles(where: { active: true }).
type Oracle @entity(immutable: false) {
  id: ID! # the oracle's address
  address: Bytes!
  active: Boolean!
  addedAt: BigInt! # block timestamp of the latest grant
  removedAt: BigInt # block timestamp of the latest removal; null while active
  updatedAt: BigInt!
}

# --- Change History (who changed what, and when) ---
# The singletons above hold the current value only. Each change is also kept as its own record.

# Immutable: One record per oracle added, oracle removed, or encryption key published
type OracleChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  kind: String! # "ADDED", "REMOVED", "ENCRYPTION_KEY"
  oracle: Bytes # the oracle added or removed; null for "ENCRYPTION_KEY"
  previousKey: Bytes # "ENCRYPTION_KEY" only; null for the first publication
  newKey: Bytes # "ENCRYPTION_KEY" only
  sender: Bytes! # who made the change: the caller the role event names, else the transaction's sender
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Immutable: One record per TreasuryUpdated event
type TreasuryChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  previousTreasury: Bytes # null for the first one seen
  newTreasury: Bytes!
  sender: Bytes! # the transaction's sender (for a multisig, the account that executed it)
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Immutable: One record per fee update event
type FeeChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  fee: String! # "PROMPT", "BRANCH", "CANCELLATION", "METADATA_UPDATE"
  previousFee: BigInt! # what FeeConfig held before; 0 if no event for this fee was seen yet
  newFee: BigInt!
  sender: Bytes! # the transaction's sender (for a multisig, the account that executed it)
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Mutable: Updated whenever admin changes any fee value
type FeeConfig @entity(immutable: false) {
  id: ID! # always "singleton"
  promptFee: BigInt
  branchFee: BigInt
  cancellationFee: BigInt
  metadataUpdateFee: BigInt
  updatedAt: BigInt!
}

# --- TEE Job Entities ---

# Immutable: One record per AgentJobSubmitted event
type AgentJob @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: Bytes!
  jobId: BigInt!
  triggerId: BigInt!
  encryptedPayload: Bytes!
  roflEncryptedKey: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# Immutable: One record per RegenerationRequested event
type RegenerationRequest @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: Bytes!
  conversationId: BigInt!
  promptMessageId: BigInt!
  originalAnswerMessageId: BigInt!
  answerMessageId: BigInt!
  encryptedPayload: Bytes!
  roflEncryptedKey: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# --- Unified Activity Log ---

# Immutable: Represents a single, discrete on-chain action
type Activity @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: Bytes! # The user who performed the action
  type: String! # e.g., "CONVERSATION", "RENAME", "BRANCH", "CANCEL", "REFUND", "PLAN_UPDATE", "PLAN_REVOKE"
  amount: BigInt! # Can be negative (cost) or positive (refund). Wei.
  timestamp: BigInt! # Block timestamp
  transactionHash: Bytes!
}
