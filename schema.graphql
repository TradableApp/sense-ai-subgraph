# --- Chat Entities ---

# Mutable: Timestamps and Metadata CIDs update over time
type Conversation @entity(immutable: false) {
  id: ID!
  owner: Bytes!
  conversationId: BigInt!
  conversationCID: String!
  conversationMetadataCID: String!
  lastMessageCreatedAt: BigInt!
  createdAtBlock: BigInt!
  isDeleted: Boolean!
  messages: [Message!]! @derivedFrom(field: "conversation")
  promptRequests: [PromptRequest!]! @derivedFrom(field: "conversation")
  branchedFrom: Conversation
}

# Immutable: Once a message is sent, it is never altered on-chain
type Message @entity(immutable: true) {
  id: ID!
  messageId: BigInt!
  conversation: Conversation!
  messageCID: String!
  role: String!
  createdAt: BigInt!
  transactionHash: String!
  searchDelta: SearchDelta
}

# Immutable: Search keywords are static for a specific message
type SearchDelta @entity(immutable: true) {
  id: ID!
  message: Message!
  searchDeltaCID: String!
}

# --- Prompt Request (For Cancelled/Pending History) ---

# This stores the raw intent before it becomes a permanent Message.
type PromptRequest @entity(immutable: false) {
  id: ID! # This will be the answerMessageId
  promptMessageId: BigInt! # Stored for frontend reference
  conversation: Conversation!
  user: Bytes!
  encryptedPayload: Bytes!
  isCancelled: Boolean!
  isAnswered: Boolean!
  isRefunded: Boolean!
  createdAt: BigInt!
  transactionHash: String!
}

# --- Financial Entities ---

# Mutable: Status changes from PENDING to COMPLETE (answered), REFUNDED or CANCELLED
type Payment @entity(immutable: false) {
  id: ID! # escrowId
  user: Bytes!
  amount: BigInt!
  status: String! # "PENDING", "COMPLETE", "REFUNDED", "CANCELLED"
  createdAt: BigInt!
  finalizedAt: BigInt
  txHash: String!
}

# Mutable: Allowance and Expiry update over time
type SpendingLimit @entity(immutable: false) {
  id: ID! # user address
  user: Bytes!
  allowance: BigInt!
  expiresAt: BigInt!
  updatedAt: BigInt!
}

# --- Protocol Configuration (Singletons) ---

# Mutable: Updated whenever the owner changes the escrow address, the treasury address or the
# key clients encrypt to. The oracles themselves are a set: see Oracle.
type ProtocolConfig @entity(immutable: false) {
  id: ID! # always "singleton"
  escrowAddress: Bytes
  treasuryAddress: Bytes
  oracleEncryptionKey: Bytes # uncompressed secp256k1 public key; null until published and after it is withdrawn
  oracleEncryptionKeyPublisher: Bytes # the oracle that published the current key; null while there is none
  updatedAt: BigInt!
}

# Mutable: One record per address that has ever held the oracle role. Several can be active at
# once (a rotation is meant to add the new oracle before removing the old one), and the set can
# be empty. Current set: oracles(where: { active: true }).
type Oracle @entity(immutable: false) {
  id: ID! # the oracle's address
  address: Bytes!
  active: Boolean!
  addedAt: BigInt! # block timestamp of the latest grant
  removedAt: BigInt # block timestamp of the latest removal; null while active
  updatedAt: BigInt!
}

# --- Change History (who changed what, and when) ---
# The singletons above hold the current value only. Each change is also kept as its own record.

# Immutable: One record per oracle added, oracle removed, or encryption key published or withdrawn
type OracleChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  kind: String! # "ADDED", "REMOVED", "ENCRYPTION_KEY"
  oracle: Bytes # the oracle added or removed; null for "ENCRYPTION_KEY"
  previousKey: Bytes # "ENCRYPTION_KEY" only; null when there was no key before
  newKey: Bytes # "ENCRYPTION_KEY" only; null when the key was withdrawn (its publisher lost the oracle role)
  caller: Bytes # "ADDED" / "REMOVED": the account that called the contract (the owner, or the oracle giving up its own role). "ENCRYPTION_KEY": the oracle that published; null for a withdrawal
  txFrom: Bytes! # the account that sent the transaction; under a multisig or a relayer this is not the caller
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Immutable: One record per TreasuryUpdated event
type TreasuryChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  previousTreasury: Bytes # null for the first one seen
  newTreasury: Bytes!
  txFrom: Bytes! # the account that sent the transaction (for a multisig, the account that executed it)
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Immutable: One record per fee update event
type FeeChange @entity(immutable: true) {
  id: ID! # txHash-logIndex
  fee: String! # "PROMPT", "BRANCH", "CANCELLATION", "METADATA_UPDATE"
  previousFee: BigInt # null for the first event seen for this fee
  newFee: BigInt!
  txFrom: Bytes! # the account that sent the transaction (for a multisig, the account that executed it)
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Mutable: Updated whenever admin changes any fee value
type FeeConfig @entity(immutable: false) {
  id: ID! # always "singleton"
  promptFee: BigInt
  branchFee: BigInt
  cancellationFee: BigInt
  metadataUpdateFee: BigInt
  updatedAt: BigInt!
}

# --- TEE Job Entities ---

# Immutable: One record per AgentJobSubmitted event
type AgentJob @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: Bytes!
  jobId: BigInt!
  triggerId: BigInt!
  encryptedPayload: Bytes!
  roflEncryptedKey: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# Immutable: One record per RegenerationRequested event
type RegenerationRequest @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: Bytes!
  conversationId: BigInt!
  promptMessageId: BigInt!
  originalAnswerMessageId: BigInt!
  answerMessageId: BigInt!
  encryptedPayload: Bytes!
  roflEncryptedKey: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# --- Unified Activity Log ---

# Immutable: Represents a single, discrete on-chain action
type Activity @entity(immutable: true) {
  id: ID! # txHash-logIndex; a CANCEL_RETURN row is txHash-logIndex-return, beside its CANCEL row
  user: Bytes! # The user who performed the action
  # One of "CONVERSATION", "BRANCH", "METADATA_UPDATE", "CANCEL", "CANCEL_RETURN", "REFUND",
  # "PLAN_UPDATE", "PLAN_REVOKE". A cancel writes two rows: CANCEL for minus the cancellation fee
  # and CANCEL_RETURN for plus the escrowed amount it released (the fee and what was sent back).
  type: String!
  amount: BigInt! # Negative for a cost; positive for money returned (REFUND) or released by a cancel (CANCEL_RETURN: the fee plus what reached the wallet). Wei.
  timestamp: BigInt! # Block timestamp
  transactionHash: Bytes!
}

# Mutable, short-lived: the escrow's DirectPaymentProcessed amounts not yet paired with the agent's
# BranchRequested / MetadataUpdateRequested of the same transaction. The escrow emits its event
# first, so the agent's handler takes the first entry for its user. A list, not one value, so two
# paid actions in one transaction (a contract wallet) each pair with their own amount, in order.
# Removed once empty.
type PendingDirectPayment @entity(immutable: false) {
  id: ID! # transaction hash
  users: [Bytes!]! # users[i] paid amounts[i]
  amounts: [BigInt!]!
}
